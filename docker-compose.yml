version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: milkyway-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_space_password
      MYSQL_DATABASE: milkyway_flea_market
      MYSQL_USER: space_operator
      MYSQL_PASSWORD: space_password123
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: