version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: hackathon-container
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: hackathon-password
      MYSQL_DATABASE: UTTC-hackathon
      MYSQL_USER: naoya-kawata
      MYSQL_PASSWORD: hackathon-password
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: